<title>Sentinel Today</title>
<meta name="description" content="Clickable mockup of Sentinel as Agora's operating system — Specialist, Account Manager and COO views">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
/* ===== Sentinel tokens (frontend/static/css/styles.css) ===== */
:root{
  --green:#54B948;--green-d:#3A9A2F;--green-strong:#2F8A2C;--green-soft:#E9F5E7;--green-line:#CFE8CB;
  --violet:#9484FB;--violet-d:#5C4BD0;--violet-bg:#F1EFFE;--sentinel:#FF6B35;--sentinel-2:#F2820C;
  --ink:#0D1117;--text:#2B333C;--sub:#5B6673;--muted:#6B7480;--white:#fff;
  --line:#E7EAEE;--line-soft:#EEF0F3;--line-strong:#D8DDE3;
  --canvas:#F6F7F9;--card:#FFFFFF;--sunken:#F1F3F5;--input:#F1F3F5;--hover:#F1F3F5;
  --ok:#54B948;--warn:#F59E0B;--danger:#EF4444;--info:#3B82F6;
  --warn-t:#B45309;--danger-t:#B91C1C;--warn-bg:#FFFBEB;--danger-bg:#FEF2F2;
  --radius:16px;--radius-sm:11px;--r-ctl:10px;--pill:999px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow:0 2px 4px rgba(16,24,40,.04),0 10px 24px -12px rgba(16,24,40,.14);
  --shadow-lg:0 2px 6px rgba(16,24,40,.05),0 18px 40px -16px rgba(16,24,40,.18);
  --grad-green:linear-gradient(135deg,#6BCB4E 0%,#3A9A2F 100%);--grad-brand:linear-gradient(90deg,#6BCB4E 0%,#54B948 55%,#3A9A2F 100%);
  --sidebar-w:232px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F1F5F2;--text:#DCE3DD;--sub:#9AA6A0;--muted:#859189;--white:#16211B;--canvas:#0B0F0D;--card:#121A16;--sunken:#0F1613;--input:#17231B;--hover:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.08);--line-soft:rgba(255,255,255,.05);--line-strong:rgba(255,255,255,.16);
  --green:#5FBE54;--green-d:#6BCB4E;--green-strong:#6BCB4E;--green-soft:rgba(95,190,84,.14);--green-line:rgba(95,190,84,.28);--violet-bg:rgba(148,132,251,.16);
  --warn-t:#FBBF24;--danger-t:#FCA5A5;--warn-bg:rgba(245,158,11,.12);--danger-bg:rgba(239,68,68,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 2px 4px rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.6);--shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px -18px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#F1F5F2;--text:#DCE3DD;--sub:#9AA6A0;--muted:#859189;--white:#16211B;--canvas:#0B0F0D;--card:#121A16;--sunken:#0F1613;--input:#17231B;--hover:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.08);--line-soft:rgba(255,255,255,.05);--line-strong:rgba(255,255,255,.16);
  --green:#5FBE54;--green-d:#6BCB4E;--green-strong:#6BCB4E;--green-soft:rgba(95,190,84,.14);--green-line:rgba(95,190,84,.28);--violet-bg:rgba(148,132,251,.16);
  --warn-t:#FBBF24;--danger-t:#FCA5A5;--warn-bg:rgba(245,158,11,.12);--danger-bg:rgba(239,68,68,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 2px 4px rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.6);--shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px -18px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14.5px;line-height:1.5;color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}button{font:inherit;color:inherit}a{color:inherit;text-decoration:none}h1,h2,h3,h4{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.svg-ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Prototype bar ===== */
.proto{position:sticky;top:0;z-index:50;background:#0D1117;color:#C7D3CB;display:flex;align-items:center;gap:16px;padding:0 18px;height:40px;font-size:12.5px}
.proto .pk{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;color:#7F918A}
.rolesw{display:inline-flex;gap:2px;background:rgba(255,255,255,.07);border-radius:var(--pill);padding:3px}
.rolesw button{border:none;background:transparent;color:#C7D3CB;border-radius:var(--pill);padding:4px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.rolesw button.on{background:#fff;color:#0D1117}
.rolesw button small{font-weight:400;opacity:.65;margin-left:6px}
.proto .spacer{flex:1}
.proto label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.proto .tbtn{border:1px solid rgba(255,255,255,.18);background:transparent;color:#C7D3CB;border-radius:var(--pill);padding:3px 10px;cursor:pointer;font-size:12px}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:calc(100vh - 40px)}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:40px;height:calc(100vh - 40px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--grad-green);display:grid;place-items:center}
.brand .logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand .wm{font-weight:800;letter-spacing:.2em;font-size:13px;color:var(--green-strong);line-height:1}
.brand .wm small{display:block;letter-spacing:.28em;font-size:7px;color:var(--muted);margin-top:3px;font-weight:600}
.navlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--sub);font-weight:600;font-size:14px;position:relative;cursor:pointer}
.nav a:hover{background:var(--hover)}
.nav a.active{background:var(--green-soft);color:var(--green-strong)}
.nav a.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--green)}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:var(--sunken);border-radius:var(--pill);padding:0 7px}
.side-foot{margin-top:auto}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--radius-sm)}
.user-card b{display:block;font-size:13px;color:var(--ink)}.user-card span{font-size:12px;color:var(--sub)}
.main{min-width:0}
.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:40px;z-index:20}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad-brand);opacity:.6}
.cmdk{display:inline-flex;align-items:center;gap:10px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--pill);padding:6px 14px;color:var(--muted);font-size:13px;width:220px}
.cmdk kbd{margin-left:auto;font:600 10px Inter,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--sub)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{width:34px;height:34px;border-radius:var(--pill);border:1px solid var(--line);background:var(--white);display:grid;place-items:center;color:var(--sub);cursor:pointer;position:relative}
.iconbtn .bdot{position:absolute;top:-4px;right:-4px;background:var(--sentinel);color:#fff;font-size:10px;font-weight:800;border-radius:var(--pill);padding:0 5px;line-height:15px}
.content{padding:30px 32px 80px;max-width:1120px}

/* active-task strip */
.active-strip{display:flex;align-items:center;gap:10px;background:var(--green-soft);border:1px solid var(--green-line);border-radius:var(--pill);padding:4px 6px 4px 14px;color:var(--green-strong);font-weight:600;font-size:13px;max-width:520px}
.active-strip .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(84,185,72,.45)}70%{box-shadow:0 0 0 8px rgba(84,185,72,0)}100%{box-shadow:0 0 0 0 rgba(84,185,72,0)}}
@media (prefers-reduced-motion:reduce){.active-strip .pulse{animation:none}}
.active-strip .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.active-strip .num{font-variant-numeric:tabular-nums;color:var(--ink);flex:none}

/* ===== Page primitives ===== */
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.pagehead h2{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.015em}
.pagehead .lead{color:var(--sub);margin:4px 0 0;font-size:14.5px;max-width:64ch}
.pagehead .lead b{color:var(--ink);font-weight:600}
.hd-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.att{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);border:1px solid var(--line);background:var(--card);border-radius:var(--pill);padding:5px 6px 5px 14px}
.att b{color:var(--ink);font-weight:600}
.sect{margin-top:30px}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sect-head h3{font-size:14px;font-weight:700;color:var(--ink)}
.sect-head .hint{font-size:13px;color:var(--muted)}
.sect-head a{font-size:13px;color:var(--green-strong);font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card.pad{padding:18px 20px}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--white);color:var(--ink);border-radius:var(--pill);padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--grad-green);border-color:transparent;color:#fff}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn .svg-ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:var(--pill);padding:2px 9px;background:var(--sunken);color:var(--sub);white-space:nowrap}
.pill.amber{background:var(--warn-bg);color:var(--warn-t)}.pill.red{background:var(--danger-bg);color:var(--danger-t)}.pill.green{background:var(--green-soft);color:var(--green-strong)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--grad-green);color:#fff;font-weight:700;font-size:11px;display:inline-grid;place-items:center;flex:none}
.avatar.sm{width:24px;height:24px;font-size:9.5px}.avatar.xs{width:20px;height:20px;font-size:8.5px}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13.5px}
.muted{color:var(--muted)}.sub{color:var(--sub)}
.num{font-variant-numeric:tabular-nums}
.new{position:relative}
body.shownew .new{outline:2px dashed var(--sentinel);outline-offset:4px;border-radius:var(--radius)}
body.shownew .new::after{content:"new";position:absolute;top:-10px;right:14px;background:var(--sentinel);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 8px;border-radius:var(--pill);z-index:2}
body.shownew .new.ext::after{content:"extended";background:var(--warn)}
body.shownew .new.ext{outline-color:var(--warn)}

/* ===== The work list: one row = one task ===== */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:13px 20px;border-top:1px solid var(--line-soft);cursor:pointer}
.row:first-child{border-top:none}
.row:hover{background:var(--hover)}
.row .t{font-weight:600;color:var(--ink);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.row .t .dot{margin-right:2px}
.row .m{font-size:13px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m b{color:var(--text);font-weight:600}
.row .r{display:flex;align-items:center;gap:12px;justify-content:flex-end;white-space:nowrap}
.due{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.due.today{color:var(--warn-t);font-weight:600}.due.late{color:var(--danger-t);font-weight:600}
.chev{color:var(--line-strong);font-size:18px;line-height:1}
.row.quiet .t{color:var(--sub);font-weight:500}
.foot{padding:10px 20px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.foot b{color:var(--sub);font-weight:600}
.group{padding:10px 20px 4px;font-size:12.5px;font-weight:700;color:var(--sub);border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.group:first-child{border-top:none}
.group .n{margin-left:auto;font-weight:500;color:var(--muted)}

/* ===== Small side lists ===== */
.side-list .row{padding:12px 18px;grid-template-columns:1fr auto}
.side-list .row .t{font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--sub)}.kv dd{margin:0;color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* ===== Time today ===== */
.time .big{font-size:28px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.time .big small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.tbar{display:flex;height:8px;border-radius:var(--pill);overflow:hidden;background:var(--sunken);margin:14px 0}
.tbar i{display:block;height:100%}
.tleg{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.tleg .k{display:flex;align-items:center;gap:8px;color:var(--sub)}
.tleg .v{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.tleg .v.muted{color:var(--muted);font-weight:500}
.tnote{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.45}

/* ===== Tables ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 16px;border-top:1px solid var(--line-soft);vertical-align:middle}
tbody tr:first-child td{border-top:none}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--hover)}
td.n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;text-align:right}
th.n{text-align:right}
td.n.zero{color:var(--muted);font-weight:400}
td.n.bad{color:var(--danger-t)}td.n.warn{color:var(--warn-t)}
.who{display:flex;align-items:center;gap:10px}.who b{color:var(--ink);font-weight:600}.who span{color:var(--sub);font-size:12.5px}
.health{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.health .dot{width:9px;height:9px}
.h-g .dot{background:var(--ok)}.h-a .dot{background:var(--warn)}.h-r .dot{background:var(--danger)}
.h-g{color:var(--green-strong)}.h-a{color:var(--warn-t)}.h-r{color:var(--danger-t)}
.band{font-size:12px;font-weight:600;color:var(--sub)}.band.heavy{color:var(--danger-t)}

/* ===== Exceptions ===== */
.exc .row{grid-template-columns:10px 1fr auto;padding:14px 20px}
.exc .sev{width:10px;height:10px;border-radius:50%}
.sev.red{background:var(--danger)}.sev.amber{background:var(--warn)}.sev.grey{background:var(--line-strong)}
.exc .t{white-space:normal}

/* ===== Stats strip ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:16px 20px;border-left:1px solid var(--line-soft)}
.stat:first-child{border-left:none}
.stat .k{font-size:12.5px;color:var(--sub)}
.stat .v{font-size:24px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v.bad{color:var(--danger-t)}.stat .v.warn{color:var(--warn-t)}
.stat .s{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ===== Calendar ===== */
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--pill);padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:var(--pill);padding:5px 14px;font-weight:600;font-size:12.5px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--green-strong);box-shadow:var(--shadow-sm)}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cal-day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);min-height:220px;padding:12px}
.cal-day.today{border-color:var(--green)}
.cal-dow{font-size:12px;color:var(--muted);font-weight:600}
.cal-num{font-size:20px;font-weight:800;color:var(--ink);line-height:1.1;margin-bottom:10px}
.today .cal-num{color:var(--green-strong)}
.ev{font-size:12.5px;font-weight:500;padding:5px 0 5px 10px;margin-bottom:6px;border-left:3px solid var(--line-strong);color:var(--text);cursor:pointer;line-height:1.3}
.ev small{display:block;color:var(--muted);font-size:11.5px}
.ev.due{border-color:var(--info)}.ev.late{border-color:var(--danger)}.ev.meet{border-color:var(--violet)}.ev.report{border-color:var(--sentinel-2)}.ev.leave{border-color:var(--line-strong);color:var(--sub)}.ev.rec{border-color:var(--green)}
.cal-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:14px}
.cal-leg i{display:inline-block;width:3px;height:12px;margin-right:7px;vertical-align:-2px}

/* ===== Kanban ===== */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:240px}
.col-head{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;color:var(--ink);padding:4px 6px 10px}
.col-head .n{color:var(--muted);font-weight:500}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;cursor:pointer}
.tcard:hover{box-shadow:var(--shadow)}
.tcard .c{font-size:12px;color:var(--sub)}.tcard .t{font-weight:600;color:var(--ink);margin:4px 0 10px;font-size:14px;line-height:1.35}
.tcard .f{display:flex;justify-content:space-between;align-items:center}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(14,15,18,.45);z-index:100;display:grid;place-items:start center;padding:48px 16px;overflow:auto}
.modal{background:var(--card);border-radius:var(--radius);width:min(860px,100%);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.modal.narrow{width:min(520px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 26px 0}
.kick{font-size:13px;color:var(--sub)}
.tb-h{font-size:21px;font-weight:800;color:var(--ink);margin:4px 0 14px;letter-spacing:-.01em}
.x-close{border:none;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--sub);cursor:pointer;font-size:18px}
.x-close:hover{background:var(--hover)}
.modal-body{padding:0 26px 20px;overflow:auto}
.facts{display:flex;gap:28px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact .k{font-size:12px;color:var(--muted)}.fact .v{font-weight:600;color:var(--ink);margin-top:2px;display:flex;align-items:center;gap:7px;font-size:14px}

function clientStats(k){
  const ts=TASKS.filter(t=>t.client===k&&t.stage!=="done");

  const blockedUs=ts.filter(t=>t.stage==="block"&&t.hold.kind!=="client").length, blockedClient=ts.filter(t=>t.stage==="block"&&t.hold.kind==="client").length;
  const reviews=ts.filter(t=>t.review==="pending").length, stale=ts.filter(t=>t.review==="pending"&&t.review_since).length;
  const health=(overdue||blockedUs||stale)?"r":(ts.some(t=>t.due===TODAY)||blockedClient)?"a":"g";
  const why=health==="r"?[overdue&&`${overdue} overdue`,blockedUs&&`${blockedUs} blocked on us`,stale&&`review waiting 30h`].filter(Boolean).join(", "):health==="a"?[blockedClient&&`waiting on client ${daysBetween("2026-08-29",TODAY)}d`,ts.some(t=>t.due===TODAY)&&"due today"].filter(Boolean).join(", "):"on track";
  return {open:ts.length,overdue,blockedUs,blockedClient,reviews,health,why,ts};
}

        <div class="fact"><div class="k">Priority</div><div class="v">${pdot(t.prio)}${t.prio}</div></div>
        <div class="fact"><div class="k">Reviewer</div><div class="v">${t.rev?PEOPLE[t.rev].name:"—"}</div></div>
        <div class="fact new"><div class="k">Time</div><div class="v">${mins(totalMin)} <span class="muted" style="font-weight:400">/ ~${mins(t.est||0)}</span></div></div>
      </div>
      ${notice}${cert}
      <div class="cols">
        <div><p class="desc">${esc(t.desc||"No description.")}</p>
          <dl class="rec"><dt>Campaign</dt><dd>${esc(t.camp)}</dd><dt>Started</dt><dd>${t.sessions.length?"Sep 1, 8:04 AM":"—"}</dd><dt>Department</dt><dd>${t.dept}</dd></dl>
          <div class="internal"><div class="lk">Internal — never seen by the client</div><dl class="rec"><dt>Filed by</dt><dd>Leo Vasquez</dd><dt>Account manager</dt><dd>Leo Vasquez</dd><dt>Raised</dt><dd>Planned ahead</dd></dl></div></div>
        <div><div class="tabs"><button class="on" data-tab="work">Work ${done}/${total}</button><button data-tab="time">Time</button><button data-tab="comments">Comments</button><button data-tab="activity">Activity</button></div>
          <div id="tab-work"><ul class="steps">${t.steps.map((s,i)=>`<li class="${s[1]?"done":""}"><input type="checkbox" ${s[1]?"checked":""} data-step="${i}"><span>${esc(s[0])}</span></li>`).join("")||'<li class="muted">No breakdown yet — apply a service template.</li>'}</ul></div>
          <div id="tab-time" hidden class="new">${t.sessions.map(s=>`<div class="sess"><span>${s[0]} – ${s[1]}</span><b>${mins(s[2])}</b></div>`).join("")}${isActive?`<div class="sess"><span>${nowStr()} – now</span><b id="live-timer-2">${fmtClock(state.elapsed)}</b></div>`:""}${!t.sessions.length&&!isActive?'<div class="empty">No sessions yet. Press Start Work.</div>':""}</div>
          <div id="tab-comments" hidden><div class="empty">${t.review_note?`<b>${PEOPLE[t.rev].name}</b>: "${esc(t.review_note)}"`:"No comments yet."}</div></div>
          <div id="tab-activity" hidden><div class="sess"><span>Created by Leo Vasquez</span><b>Aug 28</b></div>${t.sessions.length?`<div class="sess"><span>Start Work → In Progress</span><b>Sep 1, 8:04</b></div>`:""}</div>
        </div></div></div>
    <div class="modal-foot">${foot}</div></div></div>`;
  const ov=document.getElementById("ov");
  ov.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); ov.onclick=e=>{if(e.target===ov)closeModal()};
  ov.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ov.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");["work","time","comments","activity"].forEach(k=>document.getElementById("tab-"+k).hidden=k!==b.dataset.tab)});
  ov.querySelectorAll("[data-step]").forEach(c=>c.onchange=()=>{t.steps[+c.dataset.step][1]=c.checked;openTask(id)});
  const q=s=>ov.querySelector(s);
  if(q("#m-start")) q("#m-start").onclick=()=>startWork(id);
  if(q("#m-pause")) q("#m-pause").onclick=()=>{pauseWork();openTask(id)};
  if(q("#m-submit")) q("#m-submit").onclick=()=>{if(state.activeTask===id)pauseWork();t.review="pending";if(t.stage==="rev")t.stage="prog";t.rev=t.rev||"bong";toast(`Submitted — ${PEOPLE[t.rev].name} notified`);openTask(id);render()};
  if(q("#m-park")) q("#m-park").onclick=()=>parkDialog(id);
  if(q("#m-resume")) q("#m-resume").onclick=()=>{t.stage="todo";t.hold=null;toast("Resumed → To Do");openTask(id);render()};
  if(q("#m-approve")) q("#m-approve").onclick=()=>{t.review="approved";t.stage="done";toast("Approved · moved to Completed");closeModal();render()};
  if(q("#m-changes")) q("#m-changes").onclick=()=>{t.review="changes";t.stage="rev";t.review_note="Please add the frequency chart.";toast("Changes requested → Revision Needed");closeModal();render()};
}
function nowStr(){const d=new Date(2026,8,1,11,15);d.setSeconds(d.getSeconds()-state.elapsed);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function closeModal(){document.getElementById("modal-host").innerHTML=""}
function startWork(id){const t=TASKS.find(x=>x.id===id); if(state.activeTask&&state.activeTask!==id) pauseWork(); state.activeTask=id;state.elapsed=0; if(t.stage==="todo"||t.stage==="rev") t.stage="prog"; toast("Session started · In Progress"); openTask(id); render();}
function pauseWork(){if(!state.activeTask)return;const t=TASKS.find(x=>x.id===state.activeTask);const m=Math.max(1,Math.round(state.elapsed/60));t.sessions.push([nowStr(),"11:15",m]);state.activeTask=null;state.elapsed=0;toast(`Paused · ${m} min saved`);render();}
function parkDialog(id){
  const t=TASKS.find(x=>x.id===id); let kind="client";
  document.getElementById("modal-host").innerHTML=`<div class="overlay" id="ov"><div class="modal narrow"><div class="modal-head"><div><div class="kick">Park this task</div><h2 class="tb-h">Why is it waiting?</h2></div><button class="x-close" data-close aria-label="Close">✕</button></div>
   <div class="modal-body"><label class="field new"><span>Reason — internal, the client never sees it</span><div class="choices" id="kinds">${Object.entries(HOLD_KINDS).map(([k,v])=>`<button type="button" class="choice ${k===kind?"on":""}" data-k="${k}">${v}</button>`).join("")}</div></label>
   <label class="field"><span>Who or what is it on?</span><input type="text" id="pk-who" value="Client — creatives"></label><label class="field"><span>One line for the AM</span><textarea id="pk-note" rows="2">Waiting on the new creatives before the ad sets can be built.</textarea></label>
   <div class="notice">Moves to <b>Parked</b> (the client sees "Paused"), remembers it came from ${STAGE[t.stage]}, stops the timer.</div></div>
   <div class="modal-foot"><div class="end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pk-go">Park it</button></div></div></div></div>`;
  const ov=document.getElementById("ov"); ov.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>openTask(id));
  ov.querySelectorAll("#kinds .choice").forEach(b=>b.onclick=()=>{kind=b.dataset.k;ov.querySelectorAll("#kinds .choice").forEach(x=>x.classList.toggle("on",x===b))});
  ov.querySelector("#pk-go").onclick=()=>{if(state.activeTask===id)pauseWork();t.hold={kind,since:TODAY,who:ov.querySelector("#pk-who").value,note:ov.querySelector("#pk-note").value};t.stage="block";toast("Parked · Leo notified with the reason");closeModal();render()};
}

/* ===================== Wiring ===================== */
function wire(){
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{e.stopPropagation();openTask(+el.dataset.open)});
  document.querySelectorAll("[data-client]").forEach(el=>el.onclick=()=>{state.page="clients";state.client=el.dataset.client;state.ai=false;render()});
  document.querySelectorAll("[data-page]").forEach(el=>{if(!el.closest("#nav"))el.onclick=()=>{state.page=el.dataset.page;state.client=null;render()}});
  document.querySelectorAll("[data-toast]").forEach(el=>el.onclick=e=>{e.stopPropagation();toast(el.dataset.toast)});
  document.querySelectorAll("[data-open-engine]").forEach(el=>el.onclick=()=>toast("Opens the Mastery Engine at that lesson — minutes flow back automatically"));
  document.querySelectorAll("[data-target]").forEach(el=>el.onclick=()=>{const [k,v]=el.dataset.target.split(":");if(k==="client"){state.page="clients";state.client=v;render()}else if(k==="open")openTask(+v);else toast("Opens that person's Monitor row")});
  const tg=document.getElementById("ai-toggle"); if(tg) tg.onclick=()=>{state.ai=!state.ai;document.getElementById("ai-box").hidden=!state.ai;if(state.ai)document.getElementById("ai-in").focus()};
  const go=document.getElementById("ai-go"); if(go) go.onclick=()=>{const out=document.getElementById("ai-out");out.innerHTML='<div class="empty">Reading the request, this client\'s open cards, who holds them, leave and load…</div>';setTimeout(()=>{out.innerHTML=proposalsHtml();document.getElementById("ai-create").onclick=()=>{TASKS.push({id:60,title:"Analyze TCS September Meta performance",client:"tcs",camp:"Meta",dept:"Acquisition",lead:"earl",prio:"Medium",stage:"todo",due:"2026-09-02",est:90,rev:"bong",review:null,desc:"",steps:[],sessions:[]},{id:61,title:"Add Meta findings to TCS September report",client:"tcs",camp:"Reporting",dept:"Account Management",lead:"leo",prio:"Medium",stage:"block",due:"2026-09-03",est:45,rev:null,review:null,hold:{kind:"task",since:TODAY,who:"Task 60 — Earl",note:"Starts when the analysis is approved."},desc:"",steps:[],sessions:[]});toast("2 tasks created · Earl notified");state.ai=false;render()}},900)};
  const nt=document.getElementById("btn-newtask"); if(nt) nt.onclick=()=>toast("Opens the existing New Task form with the client pre-filled");
}
document.querySelectorAll("#rolesw button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#rolesw button").forEach(x=>x.classList.toggle("on",x===b));state.role=b.dataset.role;state.page="today";state.client=null;state.ai=false;render()});
document.getElementById("shownew").onchange=e=>document.body.classList.toggle("shownew",e.target.checked);
document.getElementById("themebtn").onclick=()=>{const r=document.documentElement;const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.setAttribute("data-theme",cur==="dark"?"light":"dark")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("ov"))closeModal()});
render();
</script>
